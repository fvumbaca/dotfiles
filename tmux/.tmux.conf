
# Vim-like motion between windows
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Status Bar Configuration
set-option -g status-position top

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

set-option -g status-left ""
set-option -g status-right "#{\u00E0\u00A0}#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD) cluster: #(kubectx -c)/#(kubens -c)"

# default statusbar colors
set-option -g status-style fg='#7f7f81'
set-window-option -g window-status-current-style fg='#9a9a9a'
set-window-option -g window-status-style fg='#9a9a9a'
set-option -g pane-border-style fg='#9a9a9a'

# set-option -g pane-active-border-style fg=brightgreen #base01

# default window title colors
# set-window-option -g window-status-style fg=brightblue,bg=default #base0 and default
#set-window-option -g window-status-style dim

# active window title colors
# set-window-option -g window-status-current-style fg=brightred,bg=default #orange and default
#set-window-option -g window-status-current-style bright

# pane border
# set-option -g pane-border-style fg=black #base02
# set-option -g pane-active-border-style fg=brightgreen #base01

# message text
set-option -g message-style fg=brightred,bg=black

# pane number display
# set-option -g display-panes-active-colour blue #blue
# set-option -g display-panes-colour brightred #orange

# clock
# set-window-option -g clock-mode-colour green #green

# bell
# set-window-option -g window-status-bell-style fg=black,bg=red #base02, red

set-option -sa terminal-overrides ',screen-256color:RGB'
